; remote-webcam: receives MJPEG video over ESP-NOW from rover-esp and exposes
; it to an Android phone as a USB UVC webcam.
;
;   rover-esp (camera) --ESP-NOW--> remote-webcam --USB UVC--> Android
;
; Framework note: this uses framework = espidf (not arduino). The USB UVC stack
; (usb_device_uvc) needs ESP-IDF 5.x, which means Arduino-ESP32 3.x — but on
; that core ESPNowCam doesn't compile and the Arduino-as-component build drags
; in unrelated components that fail. So we use plain ESP-IDF and talk to esp_now
; directly. The PlatformIO workflow is unchanged: pio run / pio run -t upload.
;
; Needs the pioarduino platform (it ships ESP-IDF 5.x); the stock espressif32
; platform is too old.
;
; This board MAC: 98:3D:AE:60:84:C0   Sender (rover-esp): DC:DA:0C:57:59:C8

; Isolate this project's platforms/toolchains into a dedicated core directory,
; so the pioarduino platform (which registers as "espressif32" and would
; otherwise shadow the stock platform globally) never touches ~/.platformio.
; Every other sketch keeps using the stock espressif32 from the global core.
[platformio]
core_dir = ${sysenv.HOME}/.platformio-pioarduino

[env:seeed_xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = espidf

monitor_speed = 115200
