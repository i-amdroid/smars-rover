; PlatformIO Project Configuration File
;
; Remote display node: receives 320x240 JPEG video over ESP-NOW from the rover
; (rover-esp) and shows it on a 2.4" 240x320 ILI9341 SPI TFT, on a Seeed Studio
; XIAO ESP32-S3. Uses TFT_eSPI + TJpg_Decoder + ESPNowCam.
;
; This board's MAC: 98:3D:AE:60:84:C0
;
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bodmer/TJpg_Decoder@^1.1.0
    hpsaturn/EspNowCam@^0.2.1
    nanopb/Nanopb@0.4.91

; TFT_eSPI is configured here via build flags (USER_SETUP_LOADED) instead of
; editing the library's User_Setup.h, so the config travels with the project.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    ; XIAO ESP32-S3: give TFT_eSPI its own SPI bus (HSPI). Without this the
    ; shared global SPI (FSPI) object isn't initialised and init() crashes in
    ; spi.beginTransaction() with a null bus pointer.
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    ; XIAO ESP32-S3 hardware SPI pins
    -DTFT_MISO=8    ; D9
    -DTFT_MOSI=9    ; D10
    -DTFT_SCLK=7    ; D8
    ; Control pins (free GPIOs)
    -DTFT_CS=2      ; D1
    -DTFT_DC=3      ; D2
    -DTFT_RST=4     ; D3
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=27000000
