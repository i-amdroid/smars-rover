; PlatformIO Project Configuration File
;
; Rover camera node: captures video on a Seeed Studio XIAO ESP32-S3 Sense and
; streams 320x240 JPEG frames over ESP-NOW to the remote (remote-tft) using the
; ESPNowCam library.
;
; This board's MAC: DC:DA:0C:57:59:C8
; Target (remote-tft) MAC: 98:3D:AE:60:84:C0
;
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

; XIAO ESP32-S3 Sense: 8 MB OPI PSRAM (camera frame buffers live here).
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv

lib_deps =
    hpsaturn/EspNowCam@^0.2.1
    nanopb/Nanopb@0.4.91
