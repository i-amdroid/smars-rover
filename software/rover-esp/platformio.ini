; PlatformIO Project Configuration File
;
; Rover node: drive (DRV8833) + manipulator (2 servos) + ESP-NOW camera streamer
; on a Seeed Studio XIAO ESP32-S3 Sense. Receives joystick over ESP-NOW from the
; controller and streams 320x240 JPEG video back to it (ESPNowCam).
;
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time

; XIAO ESP32-S3 Sense: 8 MB OPI PSRAM (camera frame buffers live here).
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv

lib_deps =
    hpsaturn/EspNowCam@^0.2.1
    nanopb/Nanopb@0.4.91
    madhephaestus/ESP32Servo@^3.0.5
